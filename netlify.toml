# zkLogin OAuth callback. Must precede the SPA catch-all below, which would
# otherwise swallow it and serve index.html instead of the handoff page.
[[redirects]]
  from = "/auth/callback"
  to = "/auth/callback.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "build/web"
  command = "flutter build web --release --dart-define=API_BASE_URL=https://api-v2.zendfi.tech"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
