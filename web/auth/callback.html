<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Signing you in — Zend!</title>
<!--
  OAuth callback for Sui zkLogin sign-in.

  Google only permits https redirect URIs for a Web OAuth client, and the Web
  client id is what keeps a user's zkLogin address identical across the app and
  the web (the address derives partly from `aud`, the client id). So the redirect
  lands here rather than on a custom scheme.

  On a correctly verified install this page is never rendered: Android App Links
  and iOS Universal Links hand the URL straight to the app. It exists for the
  cases where that does not happen — most importantly debug builds, whose signing
  certificate does not match the fingerprint in /.well-known/assetlinks.json, so
  domain verification legitimately fails.

  Security notes:
    * The ID token arrives in the URL *fragment*, which browsers never send to a
      server. It therefore stays on the device. Nothing here transmits it: no
      analytics, no logging, no fetch.
    * The handoff below re-emits the fragment to the app's private scheme, which
      keeps the token out of any query string and out of server logs.
    * Framing is already denied globally via X-Frame-Options, which stops a
      parent frame from reading the fragment.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10; color: #f5f5f7; text-align: center; padding: 24px;
  }
  .card { max-width: 26rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; color: #a1a1aa; line-height: 1.5; font-size: 0.95rem; }
  a.button {
    display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px;
    background: #f5f5f7; color: #0f0f10; text-decoration: none; font-weight: 600;
  }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 1.25rem;
    border: 3px solid rgba(245,245,247,0.25); border-top-color: #f5f5f7;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="spinner" role="status" aria-live="polite" aria-label="Signing you in"></div>
    <h1>Signing you in</h1>
    <p id="hint">You can close this window if it doesn't return to Zend! automatically.</p>
    <a class="button" id="manual" href="#" hidden>Open Zend!</a>
  </main>
<script>
(function () {
  // Everything after '#'. Preserved verbatim: it carries id_token and state,
  // and altering it would break the state check the app performs.
  var fragment = window.location.hash.replace(/^#/, '');
  var search = window.location.search.replace(/^\?/, '');
  var payload = fragment || search;

  // 1. Web host embedding this flow (used by flutter_web_auth_2 on web).
  //    Same-origin only, so the credential is not broadcast to other origins.
  try {
    var message = { 'flutter-web-auth-2': window.location.href };
    if (window.opener) {
      window.opener.postMessage(message, window.location.origin);
      window.close();
      return;
    }
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(message, window.location.origin);
      return;
    }
  } catch (e) {
    // Cross-origin or blocked access: fall through to the app handoff.
  }

  // 2. Native handoff. Reached when App Link / Universal Link verification did
  //    not claim the URL. The fragment is re-emitted as a fragment so the token
  //    is never placed in a query string.
  var target = 'zendapp://auth-callback' + (payload ? '#' + payload : '');
  var manual = document.getElementById('manual');
  manual.setAttribute('href', target);
  manual.hidden = false;

  if (payload) {
    window.location.replace(target);
  } else {
    // No credential present: this was a stray visit, not a real callback.
    document.getElementById('hint').textContent =
      'This page is only used while signing in. You can close it.';
  }
})();
</script>
</body>
</html>
